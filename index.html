<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bayi Yazılımı API</title>
  <meta name="description" content="Bayi Yazılımı REST API, webhook ve MCP başvuru belgesi: kimlik doğrulama, yetkiler, ürün, stok, sipariş ve cari uç noktaları.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; background: #fff; }
    @media (prefers-color-scheme: dark) { body { background: #0f1115; } }

</head>
<body>
  <script id="api-reference" data-url="openapi.yaml"></script>
  <script>
    document.getElementById('api-reference').dataset.configuration = JSON.stringify({
      theme: 'default',
      layout: 'modern',
      hideClientButton: false,
      defaultHttpClient: { targetKey: 'shell', clientKey: 'curl' },
      metaData: { title: 'Bayi Yazılımı API' },
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.76.2"></script>
</body>
